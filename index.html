<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hebrew</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@500;700;800&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#07070b;--ac:#c8a96e;--v:#8b6cff;--cy:#38e1ff;--tx:#ececf3;--mu:#8a8aa0;--bd:rgba(255,255,255,.08);--sy:Syne,system-ui,sans-serif;--mo:'DM Mono',ui-monospace,monospace;color-scheme:dark;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-behavior:smooth;scroll-padding-top:calc(72px + env(safe-area-inset-top,0px));background:var(--bg)}
body{background:var(--bg);color:var(--tx);font:300 13px/1.8 var(--mo);overflow-x:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--ac);outline-offset:3px}
body::before{content:'';position:fixed;inset:0;z-index:3;pointer-events:none;opacity:.35;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E")}
body::after{content:'';position:fixed;inset:0;z-index:2;pointer-events:none;background:radial-gradient(ellipse at 50% 35%,transparent 35%,rgba(0,0,0,.7))}
#gl{position:fixed;inset:0;width:100%;height:100%;z-index:0}
#cg{position:fixed;left:0;top:0;width:460px;height:460px;margin:-230px 0 0 -230px;border-radius:50%;z-index:1;pointer-events:none;background:radial-gradient(circle,rgba(200,169,110,.14),transparent 65%);transition:transform .35s cubic-bezier(.2,.8,.2,1)}
#bar{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 62px);height:2px;z-index:200;transform:scaleX(0);transform-origin:0 50%;background:linear-gradient(90deg,var(--ac),var(--v),var(--cy));box-shadow:0 0 12px var(--ac)}
main{position:relative;z-index:1}
nav{position:fixed;top:0;left:0;right:0;z-index:100;height:calc(64px + env(safe-area-inset-top,0px));padding:env(safe-area-inset-top,0px) 40px 0;display:flex;align-items:center;justify-content:space-between;background:rgba(7,7,11,.6);backdrop-filter:blur(18px) saturate(1.4);border-bottom:1px solid var(--bd)}
.logo{font:800 17px var(--sy);letter-spacing:.12em;text-transform:uppercase;background:linear-gradient(90deg,var(--ac),#fff,var(--ac));background-size:200%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sh 4s linear infinite}
@keyframes sh{to{background-position:-200% 0}}
.links{display:flex;gap:4px;padding:5px;border-radius:99px;background:rgba(255,255,255,.04);border:1px solid var(--bd)}
.links .nl{padding:9px 20px;border-radius:99px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mu);transition:.3s}
.links .nl:hover{color:var(--tx)}.links .nl.on{background:linear-gradient(135deg,#f0d9a3,var(--ac));color:#0a0a0a;box-shadow:0 0 22px rgba(200,169,110,.4)}
.burger{display:none;flex-direction:column;gap:5px;padding:8px}.burger i{width:22px;height:2px;background:var(--tx);border-radius:2px;transition:.3s}
.burger.open i:nth-child(1){transform:translateY(7px) rotate(45deg)}.burger.open i:nth-child(2){opacity:0}.burger.open i:nth-child(3){transform:translateY(-7px) rotate(-45deg)}
.mm{position:fixed;top:calc(70px + env(safe-area-inset-top,0px));left:12px;right:12px;z-index:99;display:flex;flex-direction:column;padding:10px;border-radius:20px;background:rgba(10,10,16,.92);border:1px solid var(--bd);backdrop-filter:blur(20px);opacity:0;translate:0 -12px;pointer-events:none;transition:.35s cubic-bezier(.2,.8,.2,1)}
